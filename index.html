    <!-- Immediate Dark Mode Default Bootstrapper -->
    <script>
      (function() {
        try {
          var t = localStorage.getItem('lumos_theme');
          if (t === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
